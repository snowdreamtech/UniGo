---
# GoReleaser (Build & Release Automation)
# Purpose: Orchestrates the compilation, packaging, and distribution of Go binaries and artifacts.
# Trigger: Automated on specific version tags (v*); manually via workflow_dispatch for snapshots.
# Permissions:
#   - contents: write (Required to create GitHub Releases, upload assets, and push tags).
#   - packages: write (Required for container registry publishing if configured).
# Concurrency:
#   - group: ${{ github.workflow }}-${{ github.ref }} (Ensures atomic release operations).
#   - cancel-in-progress: false (Release processes must complete to avoid partial releases).
# Design:
#   - Triggers automatically on release tags to ensure a high-velocity, reliable distribution.
#   - Supports manual snapshot builds to verify configuration or extract bleeding-edge binaries.

name: "📦 GoReleaser"

"on":
  push:
    tags:
      # --- Standard & Scoped SemVer ---
      - "v*" # v1.2.3
      - "V*" # V1.2.3
      - "[0-9]*" # 1.2.3
      - "**/v*" # module/v1.2 (Monorepo)
      - "**/V*" # module/V1.2
      - "**/[0-9]*" # module/1.2

      # --- Folder-based / Scoped ---
      - "v/*" # v/1.2 (Structured)
      - "V/*" # V/1.2
      - "[0-9]/*" # 1.2/3
      - "@*" # @1.0.0 (Scoped / npm-style)

      # --- Semantic & Pre-release Prefixes ---
      - "release-*" # release-v1.0
      - "stable-*" # stable-1.0
      - "exp-*" # experimental
      - "nightly-*" # nightly-build
      - "alpha-*" # Pre-release: Alpha
      - "beta-*" # Pre-release: Beta
      - "rc-*" # Pre-release: RC
      - "canary-*" # Pre-release: Canary

      # --- OS & Infrastructure Specific ---
      - "windows-*" # Platform: Windows
      - "linux-*" # Platform: Linux
      - "macos-*" # Platform: MacOS
      - "android-*" # Platform: Android
      - "ios-*" # Platform: iOS

      # --- Linux Distribution Specific ---
      - "ubuntu-*" # Distro: Ubuntu
      - "debian-*" # Distro: Debian
      - "alpine-*" # Distro: Alpine
      - "centos-*" # Distro: CentOS
      - "rhel-*" # Distro: RHEL
      - "rocky-*" # Distro: Rocky Linux
      - "fedora-*" # Distro: Fedora

      # --- BSD & Specialized Unix ---
      - "freebsd-*" # OS: FreeBSD
      - "openbsd-*" # OS: OpenBSD
      - "netbsd-*" # OS: NetBSD
      - "solaris-*" # OS: Solaris
      - "illumos-*" # OS: Illumos

      # --- Enterprise Maintenance ---
      - "hotfix-*" # Emergency Hotfix
      - "patch-*" # Version Patch
      - "fix-*" # General Fix
      - "update-*" # System Update
      - "backport-*" # Maintenance: Backport
      - "security-*" # Maintenance: Security
      - "audit-*" # Maintenance: Audit

      # --- Architecture Specific ---
      - "386-*" # Arch: x86 32-bit
      - "x86-*" # Alias: 386
      - "amd64-*" # Arch: x86 64-bit
      - "x86_64-*" # Alias: amd64
      - "armv5-*" # Arch: ARMv5 (Legacy)
      - "armv6-*" # Arch: ARMv6
      - "armv7-*" # Arch: ARMv7
      - "arm64-*" # Arch: ARM64
      - "aarch64-*" # Alias: arm64
      - "arm-*" # Generic ARM match
      - "ppc64le-*" # Arch: PowerPC 64LE
      - "ppc64-*" # Arch: PowerPC 64 (Big Endian)
      - "riscv64-*" # Arch: RISC-V 64
      - "riscv-*" # Generic RISC-V
      - "s390x-*" # Arch: System/390x
      - "loong64-*" # Arch: LoongArch 64
      - "mips-*" # Arch: MIPS (Big Endian)
      - "mipsle-*" # Arch: MIPS (Little Endian)
      - "mips64-*" # Arch: MIPS64 (Big Endian)
      - "mips64le-*" # Arch: MIPS64 (Little Endian)
      - "universal-*" # Apple Fat/Universal Binaries

      # --- Ecosystem & Channels ---
      - "tip" # Go standard: Tip/Latest
      - "wasm-*" # WebAssembly
      - "wasip1-*" # WASI
      - "latest" # Channel: Latest
      - "stable" # Channel: Stable
      - "edge" # Channel: Edge/Experimental
      - "next" # Channel: Next/Preview
      - "LTS-*" # Channel: Long Term Support

      # --- Extra Infra & Delivery ---
      - "prod-*" # Environment: Prod
      - "stage-*" # Environment: Stage
      - "test-*" # Environment: Test
      - "k8s-*" # Infra: Kubernetes
      - "docker-*" # Infra: Docker

      # --- Project & Functional Scopes ---
      - "cli-*" # Component: CLI
      - "sdk-*" # Component: SDK
      - "app-*" # Component: App
      - "api-*" # Component: API
      - "tool-*" # Component: Tool
      - "service-*" # Component: Service
      - "lib-*" # Component: Library

      # --- License & Edition Scopes ---
      - "oss-*" # Open Source Edition
      - "ee-*" # Enterprise Edition
      - "pro-*" # Professional Edition
      - "lite-*" # Lite/Free Edition

      # --- Locality & Compliance ---
      - "cn-*" # Region: China
      - "us-*" # Region: USA
      - "eu-*" # Region: Europe
      - "global-*" # Global Release
      - "compliant-*" # Compliance Release

      # --- Action-Oriented ---
      - "build-*" # Action: Build-only
      - "dist-*" # Action: Distribution
      - "artifact-*" # Action: Artifact generation

      # --- Scoped & Multilevel ---
      - "@**/*" # Scoped Tags (@org/pkg or @org/pkg/v1)

permissions: {}

env:
  UNIRTM_LOCKED: 1
  # Opt into Node.js 24 now ahead of GitHub's June 16, 2026 forced migration.
  # See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "1"

jobs:
  goreleaser:
    name: "📦 Distribution Packaging"
    runs-on: ubuntu-latest
    environment: internal
    concurrency:
      group: goreleaser-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false # Release processes must complete to avoid partial releases
    permissions:
      contents: write
      id-token: write # Required for keyless signing via Sigstore if configured
      statuses: write # Required for updating commit statuses
      security-events: write # Required if release includes security reports
      attestations: write # Required for uploading attestations
    timeout-minutes: 60 # Increased to accommodate snapcraft + flatpak SDK downloads and cross-platform compilation
    steps:
      - name: "🧹 Free Disk Space (Ubuntu)"
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false

          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: "📂 Checkout Repository Code"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Required: Fetch all tags and historical context for GoReleaser to accurately determine the next version.
          fetch-depth: 0
          persist-credentials: false

      - name: "🌐 Configure curl retry resilience"
        shell: bash
        run: |
          mkdir -p "${HOME}"
          cat << 'EOF' > "${HOME}/.curlrc"
          retry = 10
          retry-delay = 5
          retry-max-time = 120
          retry-connrefused
          EOF
          cp "${HOME}/.curlrc" "${HOME}/_curlrc" 2>/dev/null || true
          echo "CURL_HOME=${HOME}" >> "$GITHUB_ENV"

      - name: "⚡ Setup UniRTM"
        uses: snowdreamtech/setup-unirtm@663cc55933eafea30cd63f43e837cecd4a587f45 # v0.7.0
        with:
          unirtm-version: "0.33.2"
          install: true
          trust: true
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_SECRET || secrets.GITHUB_TOKEN }}

      - name: "🧹 Clean Git State (Discard Lockfile Changes)"
        shell: sh
        run: |
          # setup-unirtm runs 'unirtm install' which might update unirtm.lock if version bumped.
          # GoReleaser requires a strict clean state, so we forcefully reset the working tree.
          git reset --hard HEAD
          git clean -fd

      - name: "⚡ Cache Release Tools (Cosign & Syft)"
        id: cache-release-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin
          key: release-tools-Linux-x64-cosign-v3.0.6-syft-v1.42.3

      - name: "🔧 Setup Release Tools PATH"
        shell: bash
        run: |
          mkdir -p "${HOME}/.local/bin"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          if command -v cosign >/dev/null 2>&1; then
            echo "COSIGN_CACHED=true" >> "$GITHUB_ENV"
            echo "Cosign already cached and available in PATH"
            cosign version || true
          fi
          if command -v syft >/dev/null 2>&1; then
            echo "SYFT_CACHED=true" >> "$GITHUB_ENV"
            echo "Syft already cached and available in PATH"
            syft version || true
          fi

      - name: "📦 Install Syft (for GoReleaser SBOM)"
        if: env.SYFT_CACHED != 'true'
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_SECRET || secrets.GITHUB_TOKEN }}

      - name: "📦 Backup Syft to Cache Directory"
        if: env.SYFT_CACHED != 'true'
        shell: bash
        run: |
          SYFT_BIN="$(command -v syft 2>/dev/null || true)"
          if [ -n "${SYFT_BIN}" ] && [ -f "${SYFT_BIN}" ]; then
            mkdir -p "${HOME}/.local/bin"
            cp -f "${SYFT_BIN}" "${HOME}/.local/bin/" || true
          fi

      - name: "📦 Install Snapcraft (for GoReleaser Snap packages)"
        shell: sh
        run: |
          for i in 1 2 3; do
            if sudo snap install snapcraft --classic; then
              echo "Snapcraft installed successfully"
              exit 0
            fi
            echo "Snapcraft install attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "WARNING: Snapcraft installation failed after 3 attempts, continuing without blocking release." >&2

      - name: "📦 Install Flatpak (for GoReleaser Flatpak packages)"
        run: |
          set -e
          sudo apt update -q || true
          sudo apt install -yq flatpak flatpak-builder || true
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo || true
          for i in 1 2 3; do
            if sudo flatpak install -y --noninteractive flathub \
              org.freedesktop.Platform/x86_64/24.08 \
              org.freedesktop.Sdk/x86_64/24.08 \
              org.freedesktop.Platform/aarch64/24.08 \
              org.freedesktop.Sdk/aarch64/24.08; then
              echo "Flatpak runtimes installed successfully"
              exit 0
            fi
            echo "Flatpak install attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "WARNING: Flatpak runtime install failed, continuing without blocking release." >&2

      - name: "🔧 Set up QEMU for multi-architecture builds"
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: "🔧 Install Cosign (for keyless artifact signing)"
        if: env.COSIGN_CACHED != 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          curl-retries: 10
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_SECRET || secrets.GITHUB_TOKEN }}

      - name: "🔧 Backup Cosign to Cache Directory"
        if: env.COSIGN_CACHED != 'true'
        shell: bash
        run: |
          COSIGN_BIN="$(command -v cosign 2>/dev/null || true)"
          if [ -n "${COSIGN_BIN}" ] && [ -f "${COSIGN_BIN}" ]; then
            mkdir -p "${HOME}/.local/bin"
            cp -f "${COSIGN_BIN}" "${HOME}/.local/bin/" || true
          fi
      - name: "❄️ Install Nix (for GoReleaser nix pipe)"
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: "🌡️ Warm up Go Proxy"
        if: startsWith(github.ref, 'refs/tags/')
        shell: sh
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Warming up Go Proxy for ${TAG}..."
          # Wait up to 60 seconds for Go proxy to sync the new tag
          for i in $(seq 1 12); do
            if curl -s -f "https://proxy.golang.org/github.com/snowdreamtech/unigo/@v/${TAG}.info" > /dev/null; then
              echo "✅ Go Proxy is ready!"
              exit 0
            fi
            echo "⏳ Waiting for proxy to sync (attempt $i/12)..."
            sleep 5
          done
          echo "⚠️ Proxy might not be ready, but proceeding anyway..."

      - name: "🚀 Distribute Artifacts (GoReleaser)"
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        continue-on-error: true # We manually check status below to allow third-party failures but catch core failures
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_SECRET || secrets.GITHUB_TOKEN }}
          WORKFLOW_SECRET: ${{ secrets.WORKFLOW_SECRET }}
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
        with:
          # Orchestrates the optimized build and distribution of cross-compiled Go binaries.
          distribution: goreleaser
          version: "~> v2" # Pins to the latest stable v2 series binary
          # Run full release but continue if a specific publisher fails.
          args: ${{ startsWith(github.ref, 'refs/tags/') && 'release --clean --timeout 60m --fail-fast=false' || 'release --snapshot --clean --skip=publish --timeout 60m' }}

      - name: "🔍 Verify Core Artifacts Generation"
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ ! -f dist/metadata.json ]; then
            echo "❌ GoReleaser failed to compile or generate core artifacts!"
            exit 1
          fi
          echo "✅ Core artifacts successfully generated. Proceeding to downstream publishers."

      - name: "📦 Setup Node.js for npm Publishing"
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: "🔨 Build npm Platform Packages"
        if: startsWith(github.ref, 'refs/tags/')
        shell: sh
        run: |
          # Read the clean version from GoReleaser's metadata (already normalized:
          # v-prefix stripped, date formats converted, etc.)
          # Use node (already set up) instead of jq to avoid tool dependency
          VERSION=$(node -p "require('./dist/metadata.json').version")
          echo "Building npm packages for version: ${VERSION}"
          sh npm/scripts/build.sh --version "${VERSION}"

      - name: "🚀 Publish npm Platform Packages"
        if: startsWith(github.ref, 'refs/tags/')
        shell: sh
        run: |
          # npm/scripts/build.sh was already executed by GoReleaser after_hooks.
          # Platform packages (npm/unigo-*/bin/) and package.json files are ready.
          echo '=== Publishing platform sub-packages ==='
          for pkg in npm/*/; do
            [ -f "${pkg}package.json" ] || continue
            case "${pkg}" in
              *-*/)
                pkg_name=$(node -p "require('./${pkg}package.json').name" 2>/dev/null || echo "${pkg}")
                pkg_ver=$(node -p "require('./${pkg}package.json').version" 2>/dev/null || echo "")
                if [ -n "${pkg_name}" ] && [ -n "${pkg_ver}" ] && npm view "${pkg_name}@${pkg_ver}" version >/dev/null 2>&1; then
                  echo "⚠️  [skip] ${pkg_name}@${pkg_ver} is already published on npm."
                  continue
                fi
                echo "[publish] ${pkg_name} (${pkg_ver}) ..."
                npm publish "${pkg}" --access public --provenance --registry=https://registry.npmjs.org
                ;;
            esac
          done

          echo ""
          echo '=== Publishing root package ==='
          for pkg in npm/*/; do
            [ -f "${pkg}package.json" ] || continue
            case "${pkg}" in
              *-*/) ;;
              *)
                root_name=$(node -p "require('./${pkg}package.json').name" 2>/dev/null || echo "${pkg}")
                root_ver=$(node -p "require('./${pkg}package.json').version" 2>/dev/null || echo "")
                if [ -n "${root_name}" ] && [ -n "${root_ver}" ] && npm view "${root_name}@${root_ver}" version >/dev/null 2>&1; then
                  echo "⚠️  [skip] ${root_name}@${root_ver} is already published on npm."
                else
                  echo "[publish] ${root_name} (${root_ver}) ..."
                  npm publish "${pkg}" --access public --provenance --registry=https://registry.npmjs.org
                fi
                ;;
            esac
          done

          echo ""
          echo '[done] All npm packages published successfully!'

      - name: "🐍 Setup Python for PyPI Publishing"
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
        with:
          python-version: "3.12"

      - name: "📦 Install Python Build Tools"
        if: startsWith(github.ref, 'refs/tags/')
        run: pip install build twine wheel setuptools

      - name: "🔨 Build PyPI Platform Packages (Wheels)"
        if: startsWith(github.ref, 'refs/tags/')
        shell: sh
        run: |
          VERSION=$(node -p "require('./dist/metadata.json').version")
          echo "Building PyPI packages for version: ${VERSION}"
          sh pypi/scripts/build.sh --version "${VERSION}"

      - name: "🚀 Publish PyPI Packages"
        if: startsWith(github.ref, 'refs/tags/')
        shell: sh
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          echo "Publishing wheels to PyPI..."
          # The build.sh script outputs wheels into pypi/dist/
          twine upload pypi/dist/*.whl --skip-existing

      - name: "🛡️ Attest Build Provenance (SLSA)"
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-checksums: dist/checksums.txt

      - name: "🧹 Cleanup on Failure (Rollback)"
        if: failure() && startsWith(github.ref, 'refs/tags/')
        shell: sh
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_SECRET || secrets.GITHUB_TOKEN }}
        run: |
          echo "⚠️ Release process failed for ${GITHUB_REF_NAME}. Rolling back partial release..."
          # Delete the partial GitHub release and the associated tag to allow for a clean retry.
          gh release delete "${GITHUB_REF_NAME}" --yes --cleanup-tag

  verify:
    name: "🔍 Verify Release Signature"
    runs-on: ubuntu-latest
    needs: [goreleaser]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: "⚡ Cache Release Tools (Cosign)"
        id: cache-verify-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin
          key: release-tools-Linux-x64-cosign-v3.0.6

      - name: "🔧 Setup Release Tools PATH"
        shell: bash
        run: |
          mkdir -p "${HOME}/.local/bin"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          if command -v cosign >/dev/null 2>&1; then
            echo "COSIGN_CACHED=true" >> "$GITHUB_ENV"
            echo "Cosign already cached and available in PATH"
            cosign version || true
          fi

      - name: "🔧 Install Cosign (for keyless artifact signing)"
        if: env.COSIGN_CACHED != 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          curl-retries: 10
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_SECRET || secrets.GITHUB_TOKEN }}

      - name: "🔧 Backup Cosign to Cache Directory"
        if: env.COSIGN_CACHED != 'true'
        shell: bash
        run: |
          COSIGN_BIN="$(command -v cosign 2>/dev/null || true)"
          if [ -n "${COSIGN_BIN}" ] && [ -f "${COSIGN_BIN}" ]; then
            mkdir -p "${HOME}/.local/bin"
            cp -f "${COSIGN_BIN}" "${HOME}/.local/bin/" || true
          fi

      - name: "📥 Get tag name"
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"

      - name: "📥 Download release artifacts"
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_SECRET || secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$TAG" \
            --repo snowdreamtech/UniGo \
            --pattern 'unigo_*linux_amd64.tar.gz' \
            --pattern 'checksums.txt' \
            --pattern 'checksums.txt.sigstore.json' || true

      - name: "✅ Verify checksums"
        run: |
          if [ -f checksums.txt ]; then
            shasum -a 256 --check --ignore-missing checksums.txt
          fi

      - name: "🔒 Verify cosign signature"
        run: |
          if [ -f checksums.txt.sigstore.json ] && command -v cosign >/dev/null 2>&1; then
            VERIFIED=false
            for attempt in 1 2 3; do
              if cosign verify-blob \
                --certificate-identity "https://github.com/snowdreamtech/UniGo/.github/workflows/goreleaser.yml@refs/tags/$TAG" \
                --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
                --bundle checksums.txt.sigstore.json \
                checksums.txt; then
                VERIFIED=true
                echo "Cosign signature verified successfully on attempt $attempt"
                break
              fi
              echo "Cosign verification attempt $attempt failed, retrying in 5s..."
              sleep 5
            done
            if [ "$VERIFIED" != "true" ]; then
              echo "WARNING: Cosign verification timed out due to Sigstore service latency." >&2
            fi
          else
            echo "Skipping Cosign verification (bundle or tool unavailable)"
          fi

      - name: "🛡️ Verify SLSA attestations"
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_SECRET || secrets.GITHUB_TOKEN }}
        run: |
          TARGET_ASSET=$(find . -maxdepth 1 -name 'unigo_*linux_amd64.tar.gz' | head -n 1)
          if [ -n "$TARGET_ASSET" ]; then
            for attempt in 1 2 3; do
              if gh attestation verify "$TARGET_ASSET" \
                --repo snowdreamtech/UniGo \
                --signer-repo snowdreamtech/UniGo; then
                echo "SLSA attestation verified successfully on attempt $attempt"
                exit 0
              fi
              echo "Attestation verify attempt $attempt failed, retrying in 5s..."
              sleep 5
            done
            echo "WARNING: SLSA attestation verification timed out." >&2
          fi
